<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProLnk — Pro Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: #F8FAFC; color: #0F172A;
    -webkit-font-smoothing: antialiased;
  }
  input { font-family: inherit; }
  button { font-family: inherit; }
  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* hover affordances */
  .pl-step { transition: filter .12s, background .12s; }
  .pl-step:hover { filter: brightness(1.3); }
  .pl-tier, .pl-offer, .pl-next, button.pl-card { transition: box-shadow .15s, transform .15s, border-color .15s; }
  .pl-tier:hover, .pl-offer:hover, .pl-next:hover, button.pl-card:hover { box-shadow: 0 8px 24px rgba(15,23,42,0.08); transform: translateY(-2px); }

  @keyframes plspin { to { transform: rotate(360deg); } }
  @keyframes plpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  @keyframes pltoast { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes plfade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes plpop { from { opacity: 0; transform: scale(0.94) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="prolnk-data.jsx"></script>
<script type="text/babel" src="prolnk-ui.jsx"></script>
<script type="text/babel" src="prolnk-web-pages1.jsx"></script>
<script type="text/babel" src="prolnk-web-pages2.jsx"></script>
<script type="text/babel" src="prolnk-web-shell.jsx"></script>

<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById('root')).render(<WebApp />);
</script>
</body>
</html>
