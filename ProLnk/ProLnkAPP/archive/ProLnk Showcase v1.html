<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ProLnk — Pro App Showcase</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #EEF1F5; color: #0F172A; font-family: "Inter", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  .stage {
    min-height: 100vh; width: 100%; padding: 40px 32px;
    background:
      radial-gradient(900px 600px at 82% -10%, #DCEFEC 0%, transparent 58%),
      radial-gradient(720px 520px at -8% 112%, #E2E8F0 0%, transparent 55%),
      #EEF1F5;
    display: flex; align-items: center; justify-content: center;
  }
  .layout { display: grid; grid-template-columns: 1fr auto 1fr; gap: 52px; align-items: center; width: 100%; max-width: 1480px; }
  .sidecol { max-width: 340px; }
  .sidecol.right { justify-self: end; }

  .brand-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: #0D9488; margin-bottom: 16px; }
  .h1 { font-size: 36px; line-height: 1.08; font-weight: 800; color: #0F172A; letter-spacing: -1.4px; margin: 0 0 16px; }
  .lede { font-size: 14.5px; line-height: 1.62; color: #475569; }
  .lede b { color: #0F172A; font-weight: 700; }

  .screenlist { display: flex; flex-direction: column; gap: 2px; margin-top: 26px; }
  .screen-group { font-size: 10px; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; color: #94A3B8; padding: 16px 12px 7px; }
  .screenlist button { background: transparent; border: 1px solid transparent; border-radius: 11px; padding: 10px 12px; color: #475569; text-align: left; cursor: pointer; font: inherit; display: flex; align-items: center; gap: 12px; transition: all 150ms ease; }
  .screenlist button:hover { background: rgba(13,148,136,0.06); color: #0F172A; }
  .screenlist button.on { background: white; border-color: #E5E7EB; color: #0F172A; box-shadow: 0 1px 3px rgba(15,23,42,0.05); }
  .screenlist .num { font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 700; color: #94A3B8; width: 22px; flex-shrink: 0; }
  .screenlist button.on .num { color: #0D9488; }
  .screenlist .label { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .screenlist .label .name { font-weight: 700; font-size: 13.5px; }
  .screenlist .label .desc { font-size: 11.5px; color: #94A3B8; font-weight: 500; }

  .meta { display: flex; flex-direction: column; gap: 13px; margin-top: 22px; padding-top: 20px; border-top: 1px solid rgba(15,23,42,0.08); }
  .meta-row { display: flex; justify-content: space-between; gap: 18px; font-size: 12px; color: #475569; align-items: center; }
  .meta-row b { color: #0F172A; font-weight: 700; text-align: right; }
  .swatchrow { display: flex; gap: 6px; margin-top: 8px; }
  .swatch { width: 28px; height: 28px; border-radius: 7px; border: 1px solid rgba(15,23,42,0.08); }

  .tip { font-size: 12px; color: #475569; line-height: 1.55; padding: 13px 15px; border-radius: 12px; border: 1px solid #E5E7EB; background: white; }
  .tip b { color: #0F172A; }

  ::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }

  @keyframes plspin { to { transform: rotate(360deg); } }
  @keyframes plpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  @keyframes pltoast { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes plfade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes plsheet { from { transform: translateY(100%); } to { transform: translateY(0); } }

  @media (max-width: 1200px) {
    .layout { grid-template-columns: 1fr; gap: 28px; justify-items: center; }
    .sidecol { max-width: 440px; width: 100%; }
    .sidecol.right { display: none; }
    .stage { padding: 24px 16px; }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="prolnk-data.jsx"></script>
<script type="text/babel" src="prolnk-ui.jsx"></script>
<script type="text/babel" src="prolnk-screens-core.jsx"></script>
<script type="text/babel" src="prolnk-screens-growth.jsx"></script>
<script type="text/babel" src="prolnk-onboarding.jsx"></script>
<script type="text/babel" src="prolnk-verify.jsx"></script>
<script type="text/babel" src="prolnk-membership.jsx"></script>
<script src="image-slot.js"></script>
</head>
<body>
  <div class="stage">
    <div id="root" class="layout"></div>
  </div>
  <script type="text/babel" src="prolnk-showcase.jsx"></script>
</body>
</html>
